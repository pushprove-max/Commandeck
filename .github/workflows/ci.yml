name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools the scripts call
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      # The tests build throwaway repos and commit in them.
      - name: Git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      # The runner image's Node 22.23.3 is unpatched; 24.22.1 is the patched Node 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      # The dashboard's DOM tests need jsdom, which the plugin does not ship.
      - name: jsdom for the dashboard's DOM tests
        run: |
          npm install --prefix "$RUNNER_TEMP/dom" --no-save jsdom@26
          echo "COMMANDECK_TEST_NODE_MODULES=$RUNNER_TEMP/dom/node_modules" >> "$GITHUB_ENV"
      - name: Leak test
        run: bash ci/leak-test.sh
      # The manifests and every component file, checked by the CLI that loads them. Pinned: a new CLI version
      # may add a rule, and a plugin change should not fail on that alone.
      - name: Plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          claude plugin validate .
      # The hooks module's own tests, run by the engine itself (the same pinned CLI).
      - name: Plugin test
        run: claude plugin test .
      # The checkout brings one commit; the check compares with the main branch, so that is fetched
      # here. A push to main itself is compared with main as it was before the push.
      - name: Version check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --unshallow origin main 2>/dev/null || git fetch --no-tags origin main
          BASE=FETCH_HEAD
          if [ "$GITHUB_REF" = refs/heads/main ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BASE=$BEFORE; fi
          bash ci/version-check.sh "$BASE"
      - name: Shell tests
        run: bash scripts/run-shell-tests.sh
      # Over 10240 bytes a hook's print reaches the session as a 2 KB preview: every seat's print stays under it.
      - name: Startup print size
        run: bash scripts/startup-size.sh
      # A template, doc or hook that names a retired name, an unknown option or a missing file misleads the next agent.
      - name: Rules audit
        run: bash scripts/rules-audit.sh --repo .
  # The Mac's own /bin/bash is 3.2, which the Ubuntu job never meets: these two
  # files start every hook and setup.sh under it, and run-hook.test.sh runs
  # `/bin/bash -n` over every shell file in the tree. Homebrew's Bash runs the tests.
  mac-bash-3:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A Mac with no Homebrew, the case the restart under a newer Bash exists for: setup started
      # by the Mac's own Bash 3.2, with the system's tools alone, must reach its requirements report.
      # COMMANDECK_BREW_PREFIX names an empty folder, so the runner's own Homebrew is not found.
      - name: Setup with no Homebrew
        run: |
          /bin/bash -c '[ "${BASH_VERSINFO[0]}" = 3 ]'
          T=$(mktemp -d); mkdir "$T/home" "$T/nobrew" "$T/proj"; git -C "$T/proj" init -q
          rc=0; out=$(cd "$T/proj" && env -i HOME="$T/home" PATH=/usr/bin:/bin:/usr/sbin:/sbin COMMANDECK_BREW_PREFIX="$T/nobrew" /bin/bash "$GITHUB_WORKSPACE/scripts/setup.sh" </dev/null 2>&1) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 1 ] && grep -q '^setup: requirements are missing' <<<"$out" && grep -q '^  Homebrew: it is not installed' <<<"$out"
      - name: Tools the scripts call
        run: brew install bash coreutils gnu-sed grep flock jq ripgrep
      - name: Git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Bash 3.2 tests
        run: |
          /opt/homebrew/bin/bash hooks/__tests__/run-hook.test.sh
          /opt/homebrew/bin/bash scripts/__tests__/requirements.test.sh
