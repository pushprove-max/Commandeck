name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools the scripts call
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      # The tests build throwaway repos and commit in them.
      - name: Git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Leak test
        run: bash ci/leak-test.sh
      # The checkout brings one commit; the check compares with the main branch, so that is fetched
      # here. A push to main itself is compared with main as it was before the push.
      - name: Version check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --unshallow origin main 2>/dev/null || git fetch --no-tags origin main
          BASE=FETCH_HEAD
          if [ "$GITHUB_REF" = refs/heads/main ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BASE=$BEFORE; fi
          bash ci/version-check.sh "$BASE"
      - name: Shell tests
        run: bash scripts/run-shell-tests.sh
  # The Mac's own /bin/bash is 3.2, which the Ubuntu job never meets: these two
  # files start every hook and setup.sh under it, and run-hook.test.sh runs
  # `/bin/bash -n` over every shell file in the tree. Homebrew's Bash runs the tests.
  mac-bash-3:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools the scripts call
        run: brew install bash coreutils gnu-sed grep flock jq
      - name: Git identity for fixture repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Bash 3.2 tests
        run: |
          /opt/homebrew/bin/bash hooks/__tests__/run-hook.test.sh
          /opt/homebrew/bin/bash scripts/__tests__/setup-requirements.test.sh
